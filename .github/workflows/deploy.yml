# Builds the Astro site on every pull request and push to main,
# and deploys it to GitHub Pages only on pushes to main.
name: Deploy Astro to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install, build, and upload the site
        uses: withastro/action@v6.1.3
        with:
          node-version: 24.21.0

  deploy:
    # A user site has no preview, so pull requests stop after the build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Allow only one deployment at a time, and let a running one finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
